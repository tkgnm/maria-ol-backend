# fly.toml app configuration file generated for maria-ol-backend on 2026-09-09T10:19:21+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'maria-ol-backend'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '1337'

[[mounts]]
  source = 'strapi_uploads'
  destination = '/app/public/uploads'

[[services]]
  protocol = 'tcp'
  internal_port = 1337
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls']

  [[services.http_checks]]
    interval = '10s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/_health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
